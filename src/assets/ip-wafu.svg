    <circle cx="216.57" cy="387.54" r="1.39" opacity="0.53"/>
    <circle cx="223.01" cy="388.42" r="1.45" opacity="0.56"/>
    <circle cx="234.46" cy="392.21" r="1.49" opacity="0.59"/>
    <circle cx="243.66" cy="393.52" r="1.54" opacity="0.62"/>
    <circle cx="255.25" cy="396.17" r="1.53" opacity="0.65"/>
    <circle cx="263.74" cy="395.7" r="1.63" opacity="0.67"/>
    <circle cx="278.57" cy="397.89" r="1.99" opacity="0.7"/>
    <circle cx="290.15" cy="398.99" r="1.86" opacity="0.73"/>
    <circle cx="298.67" cy="396.18" r="1.76" opacity="0.76"/>
    <circle cx="312.97" cy="393.18" r="1.85" opacity="0.79"/>
    <circle cx="325.61" cy="394.63" r="1.94" opacity="0.82"/>
    <circle cx="334.72" cy="388.75" r="2.11" opacity="0.85"/>
    <circle cx="346.78" cy="386.09" r="2.14" opacity="0.88"/>
    <circle cx="359.85" cy="385.08" r="2.42" opacity="0.91"/>
    <circle cx="371.88" cy="382.47" r="2.47" opacity="0.94"/>
