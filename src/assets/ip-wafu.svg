    <circle cx="438.61" cy="157.44" r="2.24" opacity="0.91"/>
    <circle cx="462.4" cy="150.43" r="2.39" opacity="0.94"/>
    <path d="M209,376 C300,350 440,296 598,338" fill="none" stroke="#C9A86A" stroke-width="0.7" opacity="0.28"/>
    <circle cx="227.74" cy="371.32" r="1.19" opacity="0.53"/>
    <circle cx="247.62" cy="363" r="1.54" opacity="0.56"/>
    <circle cx="268.1" cy="357.24" r="1.39" opacity="0.59"/>
    <circle cx="287.29" cy="354.28" r="1.41" opacity="0.62"/>
    <circle cx="311.34" cy="346.67" r="1.47" opacity="0.65"/>
    <circle cx="335.04" cy="339.96" r="1.87" opacity="0.67"/>
