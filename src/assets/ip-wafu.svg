      <path d="M478,84 L604,84" stroke="#4A5A6F" stroke-width="0.9" opacity="0.55"/>
      <!-- めくれた角（裏） -->
      <path d="M608,198 L588,211.02 L588,200 Z" fill="#0E1A2B" stroke="#C9A86A" stroke-width="1.1" stroke-linejoin="round"/>
      <!-- 切りっぱなしの房 -->
      <path d="M482,213.08 L482.6,218.08 M491,214.37 L491.6,219.37 M500,215.59 L500.6,220.59 M509,216.52 L509.6,221.52 M518,216.97 L518.6,221.97 M527,216.87 L527.6,221.87 M536,216.24 L536.6,221.24 M545,215.19 L545.6,220.19 M554,213.92 L554.6,218.92 M563,212.66 L563.6,217.66 M572,211.65 L572.6,216.65 M581,211.08 L581.6,216.08" fill="none" stroke="#C9A86A" stroke-width="0.8" opacity="0.6"/>
      <!-- 柄：うさぎ -->
      <use href="#ip-usagi" transform="translate(541 188) scale(0.62)"/>
    </g>
    <g id="goods-2">
      <!-- 湯気 -->
      <path d="M634,280 C629,270 639,264 635,252 M654,282 C649,272 659,266 655,254" fill="none" stroke="#F8F5EE" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
      <!-- 茶托 -->
      <ellipse cx="644" cy="389" rx="56" ry="8" fill="#F8F5EE" fill-opacity="0.1" stroke="#C9A86A" stroke-width="1.1"/>
      <!-- 胴 -->
      <path d="M602,300 C600,330 606,362 610,382 C618,390 670,390 678,382 C682,362 688,330 686,300 Z" fill="#F8F5EE" fill-opacity="0.13" stroke="#C9A86A" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- 口 -->
      <ellipse cx="644" cy="300" rx="42" ry="7" fill="#0E1A2B" fill-opacity="0.6" stroke="#C9A86A" stroke-width="1.2"/>
      <!-- 釉の線 -->
      <path d="M603,314 C624,318 664,318 685,314" fill="none" stroke="#4A5A6F" stroke-width="0.9" opacity="0.55"/>
      <!-- 柄：うさぎ -->
      <use href="#ip-usagi" transform="translate(644 376) scale(0.52)"/>
    </g>
    <g id="goods-3">
      <!-- 紙 -->
      <path d="M378.84,480.79 L313.94,454.56 A164,164 0 0 1 618.06,454.56 L553.16,480.79 A94,94 0 0 0 378.84,480.79 Z" fill="#F8F5EE" fill-opacity="0.13" stroke="#C9A86A" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- 折り目 -->
      <path d="M387.46,464.35 L329.82,426.43 M399.15,449.92 L350.07,401.41 M413.44,438.07 L374.85,380.87 M429.78,429.26 L403.18,365.59 M447.53,423.83 L433.97,356.18 M466,422 L466,353 M484.47,423.83 L498.03,356.18 M502.22,429.26 L528.82,365.59 M518.56,438.07 L557.15,380.87 M532.85,449.92 L581.93,401.41 M544.54,464.35 L602.18,426.43" fill="none" stroke="#4A5A6F" stroke-width="0.8" opacity="0.45"/>
      <!-- 骨 -->
      <path d="M459.32,511.6 L387.46,464.35 M460.31,510.38 L399.15,449.92 M461.53,509.37 L413.44,438.07 M462.92,508.62 L429.78,429.26 M464.43,508.16 L447.53,423.83 M466,508 L466,422 M467.57,508.16 L484.47,423.83 M469.08,508.62 L502.22,429.26 M470.47,509.37 L518.56,438.07 M471.69,510.38 L532.85,449.92 M472.68,511.6 L544.54,464.35" fill="none" stroke="#C9A86A" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
      <path d="M462.29,514.5 L313.94,454.56 M469.71,514.5 L618.06,454.56" fill="none" stroke="#C9A86A" stroke-width="2.2" stroke-linecap="round"/>
