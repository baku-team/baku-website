    <path d="M208,368 C262,300 340,160 472,150" fill="none" stroke="#C9A86A" stroke-width="0.7" opacity="0.28"/>
    <circle cx="217.25" cy="353.39" r="1.27" opacity="0.53"/>
    <circle cx="228.29" cy="339.32" r="1.31" opacity="0.56"/>
    <circle cx="241.82" cy="321.54" r="1.45" opacity="0.59"/>
