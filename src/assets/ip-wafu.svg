<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" width="720" height="528" role="img" aria-label="掛け軸に描かれた月うさぎの原画に朱の印。そこから金の粒が流れ、同じうさぎの手ぬぐい・湯呑み・扇子になる">
  <defs>
    <g id="ip-usagi" stroke="#C9A86A" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
      <!-- 尾 -->
      <circle cx="-40" cy="-24" r="6.5" fill="#F8F5EE" fill-opacity="0.92"/>
      <!-- 耳（後ろ・前） -->
      <path d="M12,-62 C2,-80 -4,-102 2,-122 C14,-112 22,-90 26,-64 Z" fill="#F8F5EE" fill-opacity="0.92"/>
      <path d="M26,-64 C22,-86 22,-106 32,-126 C42,-110 42,-88 38,-66 Z" fill="#F8F5EE" fill-opacity="0.92"/>
      <!-- 体と頭 -->
      <path d="M-26,0 C-36,-2 -43,-14 -37,-26 C-33,-44 -18,-58 2,-64 C8,-72 18,-78 28,-76 C40,-74 47,-64 45,-52 C43,-42 37,-36 34,-30 C40,-18 38,-6 30,0 Z" fill="#F8F5EE" fill-opacity="0.92"/>
      <!-- 耳の内側・後ろ脚 -->
      <path d="M10,-74 C6,-88 4,-100 7,-112 M-14,-4 C-23,-16 -16,-32 2,-30" fill="none" stroke="#4A5A6F" stroke-width="0.9" opacity="0.6"/>
      <!-- 目 -->
      <circle cx="34" cy="-59" r="2.3" fill="#0E1A2B" stroke="none"/>
    </g>
  </defs>

  <!-- 瑞雲 -->
  <g id="cloud-a" opacity="0.75">
    <path d="M284,66 A14.22,14.22 0 0 1 312,61 A20.3,20.3 0 0 1 352,54 A19.16,19.16 0 0 1 390,59 A12.5,12.5 0 0 1 414,66 C418,70.95 416,75 408,77 C375,79 342.5,79 323,78 C303.5,79 288,78 282,76 C275,73 276,69 284,66 Z" fill="#F8F5EE" fill-opacity="0.05" stroke="#C9A86A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M287.36,68.2 A11.2,11.2 0 0 1 309.2,63.2 M316.8,63.2 A15.99,15.99 0 0 1 348,56.2 M356.56,56.2 A15.03,15.03 0 0 1 386.2,61.2 M392.88,61.2 A9.99,9.99 0 0 1 411.6,68.2" fill="none" stroke="#C9A86A" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- 原画（掛け軸の月うさぎ） -->
  <g id="origin">
    <!-- 紐 -->
    <path d="M104,57 L160,22 L216,57" fill="none" stroke="#C9A86A" stroke-width="0.9" opacity="0.8"/>
    <circle cx="160" cy="20" r="3" fill="none" stroke="#C9A86A" stroke-width="0.9"/>
    <!-- 表装 -->
    <rect x="96" y="60" width="128" height="392" fill="#F8F5EE" fill-opacity="0.08" stroke="#C9A86A" stroke-width="1.4"/>
    <!-- 風帯（上から垂れる二本の帯） -->
    <rect x="126" y="60" width="8" height="56" fill="#F8F5EE" fill-opacity="0.06" stroke="#C9A86A" stroke-width="0.8" opacity="0.6"/>
    <rect x="186" y="60" width="8" height="56" fill="#F8F5EE" fill-opacity="0.06" stroke="#C9A86A" stroke-width="0.8" opacity="0.6"/>
    <!-- 本紙 -->
    <rect x="108" y="104" width="104" height="288" fill="#F8F5EE" fill-opacity="0.14" stroke="#C9A86A" stroke-width="0.9" opacity="0.9"/>
    <!-- 上の棒（八双）と下の棒（軸木） -->
    <rect x="90" y="57" width="140" height="6" rx="3" fill="#0E1A2B" stroke="#C9A86A" stroke-width="1.2"/>
    <rect x="86" y="451" width="148" height="10" rx="5" fill="#0E1A2B" stroke="#C9A86A" stroke-width="1.3"/>
    <!-- 絵：月とうさぎ -->
    <circle cx="172" cy="238" r="36" fill="#F8F5EE" fill-opacity="0.08" stroke="#C9A86A" stroke-width="1" opacity="0.9"/>
    <use href="#ip-usagi" transform="translate(160 352) scale(1)"/>
  </g>

  <!-- 朱の印（許諾） -->
  <g id="seal" transform="translate(193 374) rotate(-4)">
    <rect x="-14" y="-14" width="28" height="28" rx="2.5" fill="#C8462D"/>
    <rect x="-10.5" y="-10.5" width="21" height="21" fill="none" stroke="#F8F5EE" stroke-width="1" opacity="0.7"/>
    <use href="#ip-usagi" transform="translate(-1 9) scale(0.15)"/>
  </g>

