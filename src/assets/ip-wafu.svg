    <circle cx="282.27" cy="268.02" r="1.74" opacity="0.67"/>
    <circle cx="298.85" cy="250.25" r="1.7" opacity="0.7"/>
    <circle cx="315.35" cy="232.82" r="1.71" opacity="0.73"/>
    <circle cx="334.66" cy="216.16" r="1.87" opacity="0.76"/>
    <circle cx="352.9" cy="197.59" r="2.22" opacity="0.79"/>
